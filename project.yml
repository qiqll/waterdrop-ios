name: WaterDrop
options:
  bundleIdPrefix: com.waterdrop
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top
  createIntermediateGroups: true

configFiles:
  Debug: Configs/Secrets.xcconfig
  Release: Configs/Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: true

targets:
  WaterDrop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaterDrop
        type: group
        excludes:
          - "fusionAuthSDK_APP_iOS_v1.2.12_operator_ui_log_static/**"
      - path: Frameworks/ATAuthSDK.bundle
        type: folder
        buildPhase: resources
      - path: Frameworks/AlicomCaptcha4.bundle
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yjqi.waterdrop.ios
        INFOPLIST_FILE: WaterDrop/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "水滴管家需要使用麦克风来录制语音指令"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "水滴管家需要语音识别功能来理解您的语音指令"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        SWIFT_OBJC_BRIDGING_HEADER: WaterDrop/BridgingHeader.h
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Frameworks"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "-ObjC"
          - "-framework"
          - "AlicomFusionAuth"
          - "-framework"
          - "UMCommon"
          - "-framework"
          - "UMDevice"
    dependencies:
      - framework: Frameworks/AlicomFusionAuth.framework
        embed: true
      - framework: Frameworks/UMCommon.framework
        embed: false
      - framework: Frameworks/UMDevice.framework
        embed: false
      - sdk: CoreTelephony.framework
      - sdk: SystemConfiguration.framework
      - sdk: libc++.tbd
      - sdk: libz.tbd
    preBuildScripts: []
    postBuildScripts: []

  # F-005：iOS 侧 F-011 契约回归用例。
  # 走 API 层而非 UI 层，原因见 WaterDropTests/F011ContractAPITests.swift 顶部注释
  # （一键登录需真 SIM、模拟器 keychain 无法外部写入）。
  WaterDropTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaterDropTests
    # 注意：本 target 有 TEST_HOST，用例跑在宿主 App 的进程里，
    # 所以 ATS 走的是 WaterDrop/Resources/Info.plist 那份配置，这里不用重复声明。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yjqi.waterdrop.ios.tests
        # 必须与宿主 App 一致，否则测试 bundle 的架构跟宿主对不上
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: arm64
    dependencies:
      - target: WaterDrop

schemes:
  WaterDrop:
    build:
      targets:
        WaterDrop: all
        WaterDropTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - WaterDropTests
